name: build-installer

# 触发：推送 v* 标签（版本号取自标签，自动出包并挂 Release）；
#       或手动运行（版本号自动递增 patch，第四段用 CI 运行号区分每次构建）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "可选：指定版本号（如 2.1.0）。留空 = 自动递增 patch"
        required: false
        default: ""

permissions:
  contents: write

env:
  # 代码签名证书：把 .pfx 转 base64 后存入仓库 Secret，密码存入另一个 Secret。
  # 未配置时自动跳过签名（产物为未签名），不阻断出包。
  SIGN_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
  SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 PyYAML trafilatura requests numpy psutil "edge-tts==7.3.1" "sherpa-onnx==1.12.40" pyinstaller

      - name: Install optional voice dependencies (best-effort)
        shell: pwsh
        continue-on-error: true
        run: |
          # 语音增强依赖（sounddevice/webrtcvad/resemblyzer）。装不上不阻断出包：
          # 程序对缺失语音依赖有优雅降级，exe 仍可纯文字 + HUD 运行。
          python -m pip install sounddevice webrtcvad resemblyzer

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          Write-Host "ISCC: $iscc"

      # —— 版本号：单一事实源 jarvis_console/__init__.py，再派生 inno/exe 版本资源 ——
      - name: Resolve version (tag / input / auto-bump)
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $inputVer = "${{ inputs.version }}"
          if ($ref -like "refs/tags/v*") {
            $ver = $ref -replace "^refs/tags/v", ""
            Write-Host "标签触发，版本号取自标签：$ver"
            python tools\bump_version.py --from-tag $ver --write-inno --write-winver --github-output
          } elseif ($inputVer -ne "") {
            Write-Host "手动指定版本：$inputVer"
            python tools\bump_version.py --set $inputVer --write-inno --write-winver --github-output
          } else {
            Write-Host "自动递增 patch，构建号 = ${{ github.run_number }}"
            python tools\bump_version.py --bump patch --build ${{ github.run_number }} --write-inno --write-winver --github-output
          }
          if ($LASTEXITCODE -ne 0) { throw "版本号解析失败" }
          Write-Host "版本：" $env:GITHUB_OUTPUT
          Get-Content jarvis_console\platform\win\version.iss

      - name: Show version summary
        shell: pwsh
        run: |
          Write-Host "version     = ${{ steps.version.outputs.version }}"
          Write-Host "display     = ${{ steps.version.outputs.display }}"
          Write-Host "output base = ${{ steps.version.outputs.out_base }}"
          Write-Host "file version= ${{ steps.version.outputs.file_version }}"

      # —— 签名证书准备（无 Secret 时整段跳过）——
      - name: Prepare signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "jarvis-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signtool = Get-ChildItem $kits -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw "未找到 signtool.exe（Windows SDK 未安装）" }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "signtool: $signtool"

      - name: Build exe (PyInstaller, onedir)
        shell: pwsh
        run: |
          python -m PyInstaller jarvis_console\platform\win\jarvis.spec --noconfirm --clean --distpath dist --workpath .build

      - name: Sign application (Jarvis.exe)
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com /f $env:SIGN_PFX /p $env:SIGN_PFX_PASSWORD dist\Jarvis\Jarvis.exe
          if ($LASTEXITCODE -ne 0) { throw "Jarvis.exe 签名失败" }
          & $env:SIGNTOOL verify /pa /v dist\Jarvis\Jarvis.exe
          if ($LASTEXITCODE -ne 0) { throw "Jarvis.exe 签名校验失败" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "jarvis_console\platform\win\build.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: Sign installer
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Jarvis-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "找不到安装包产物" }
          & $env:SIGNTOOL sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com /f $env:SIGN_PFX /p $env:SIGN_PFX_PASSWORD $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "安装包签名失败" }
          & $env:SIGNTOOL verify /pa /v $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "安装包签名校验失败" }

      - name: Signing status notice
        if: env.SIGN_PFX == ''
        shell: pwsh
        run: |
          Write-Host "::notice::未配置 WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD，本次产物未签名（Windows 首次运行可能提示“已保护你的电脑”）。"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Setup-${{ steps.version.outputs.version }}
          path: |
            installer\Jarvis-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-portable-${{ steps.version.outputs.version }}
          path: dist\Jarvis\
          if-no-files-found: warn

      - name: Publish to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Jarvis ${{ steps.version.outputs.version }}
          files: |
            installer/Jarvis-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
