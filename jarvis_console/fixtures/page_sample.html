<article>
  <h1>AI Agent 实战示例</h1>
  <p>这个离线页面用于验证网页正文抓取。AI Agent 可以根据用户目标选择工具，读取真实返回，并把结果整理成可复用的资料。</p>
  <p>实现时应让网络请求与本地推理离开 Qt 主线程，同时把每一步状态回灌到过程面板。模型产生的思考字段不能进入下一轮 messages。</p>
  <p>有长期价值的清单可以沉淀到知识库，但必须在界面中明示并提供撤回入口。</p>
</article>
